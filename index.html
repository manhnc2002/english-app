<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lingo Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout: mobile-first single column, bottom tab bar; wide screens centre a 560px app column. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14201e; --muted:#5d6b68; --line:#dbe2e0;
  --accent:#0d6b5c; --accent-ink:#ffffff; --pop:#e8563a; --good:#1f8a4c; --bad:#c23b2a; --warn:#b9770e;
  --font-display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
  --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --surface:#162120; --ink:#e8f0ee; --muted:#93a5a1; --line:#25352f;
    --accent:#3fc2a8; --accent-ink:#06211c; --pop:#ff7a5c; --good:#4cc47f; --bad:#ff7d6b; --warn:#e5a23a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --ink:#e8f0ee; --muted:#93a5a1; --line:#25352f;
  --accent:#3fc2a8; --accent-ink:#06211c; --pop:#ff7a5c; --good:#4cc47f; --bad:#ff7d6b; --warn:#e5a23a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 8px}
.brand{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--pop)}
.hstats{display:flex;gap:8px;align-items:center}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;font-size:15px}
main{flex:1;overflow-y:auto;padding:8px 16px 24px;min-height:0}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
nav button{background:none;border:0;border-radius:12px;padding:8px 2px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h2{font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
/* home */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero h2{font-size:30px;margin:0}
.hero p{margin:0;opacity:.9}
.hero .btn{background:var(--accent-ink);color:var(--accent);border:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.week{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px}
.week div.today i{background:var(--pop)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* flashcard */
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted);font-weight:600}
.progress .bar{flex:1}
.flip{perspective:1000px;margin-bottom:14px}
.face{min-height:300px;border-radius:22px;border:1px solid var(--line);background:var(--surface);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;width:100%;cursor:pointer}
.face .tag{font-size:12px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:99px;padding:2px 10px}
.word{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-.03em;overflow-wrap:anywhere}
.ipa{color:var(--muted);font-size:17px}
.vi{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:1.2}
.ex{font-size:16px;margin:0}
.exvi{font-size:14px;color:var(--muted);margin:0}
.hint{font-size:13px;color:var(--muted)}
.speak{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:10px 4px;font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:0;align-items:center}
.rate button small{font-weight:400;color:var(--muted);font-size:11px}
.r0{border-color:var(--bad)!important;color:var(--bad)}
.r1{border-color:var(--warn)!important;color:var(--warn)}
.r2{border-color:var(--good)!important;color:var(--good)}
.r3{border-color:var(--accent)!important;color:var(--accent)}
/* quiz */
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:10px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-weight:500;min-height:52px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.q{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 2px;overflow-wrap:anywhere}
/* listening */
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:18px}
.field.right{border-color:var(--good)} .field.wrong{border-color:var(--bad)}
.msg{min-height:24px;font-weight:600}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.big{font-family:var(--font-display);font-weight:800;font-size:24px}
/* list */
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.li .t{flex:1;min-width:0}
.li b{display:block;overflow-wrap:anywhere}
.li span{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.lv{font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--line);color:var(--muted);white-space:nowrap}
.lv.k{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.lv.n{background:color-mix(in srgb,var(--pop) 16%,transparent);color:var(--pop)}
label{font-size:13px;font-weight:600;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:9}
.seg.full{display:flex;width:100%;margin:4px 0 0}
.seg.full button{flex:1;padding:9px 14px}
.pic{display:flex;gap:8px;justify-content:center;align-items:center;min-height:60px}
.pic img{max-width:100%;height:auto}
.emo{line-height:1}
.word.sm{font-size:32px}.word.xs{font-size:25px;line-height:1.2;letter-spacing:-.01em}
.wd{display:inline-block;padding:1px 8px;border-radius:8px;font-weight:600;margin:2px}
.wd.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.wd.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;border-radius:16px;padding:9px 13px;border:1px solid var(--line);background:var(--surface)}
.bub.a{align-self:flex-start}
.bub.b{align-self:flex-end;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.bub small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.bub span{display:block;font-size:13px;color:var(--muted)}
.bub.playing{outline:2px solid var(--pop)}
.deflab{font-size:14px;color:var(--muted);margin:0;text-align:left}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Lingo<span>.</span>Daily</div>
    <div class="hstats">
      <span class="chip" id="streakChip" title="Chuỗi ngày học liên tiếp"></span>
      <button class="iconbtn" id="themeBtn" aria-label="Đổi giao diện sáng/tối">◐</button>
    </div>
  </header>
  <div style="padding:0 16px 4px"><div class="seg full" id="modeseg" role="group" aria-label="Chọn phần học"><button data-d="toeic">TOEIC</button><button data-d="talk">Giao tiếp</button></div></div>
  <main id="view" tabindex="-1"></main>
  <nav id="nav" aria-label="Chính"></nav>
</div>

/* ---------- Trạng thái (lưu localStorage nếu có) ---------- */
const KEY='lingo-daily-v1';
const INTERVALS=[0,1,2,4,8,16,32]; // ngày theo hộp
const NEW_PER_DAY=8;
let mem=null;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){} return mem;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} mem=S;}
let S=load()||{cards:{},custom:[],log:{},newToday:{d:'',n:0}};
if(!S.cat)S.cat='all';
if(!S.deck)S.deck='toeic';
if(!S.extra)S.extra={};
if(!S.scores)S.scores={};
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fullList=()=>BUILTIN.concat(S.custom);
const allWords=()=>fullList().filter(w=>(w.deck||'toeic')===S.deck);
const inCat=w=>S.cat==='all'||(w.cat||'Chung')===S.cat;
const poolWords=()=>{const p=allWords().filter(inCat);return p.length>=4?p:allWords();};
const card=id=>S.cards[id]||null;
function today(){return dayKey();}
function logReview(ok){const k=today();const l=S.log[k]||(S.log[k]={n:0,ok:0});l.n++;if(ok)l.ok++;}
function streak(){let n=0,t=Date.now();if(!S.log[dayKey(t)])t-=864e5;while(S.log[dayKey(t)]&&S.log[dayKey(t)].n>0){n++;t-=864e5;}return n;}
function dueCards(){const now=Date.now();return allWords().filter(inCat).filter(w=>{const c=card(w.id);return c&&c.due<=now;});}
function newCards(){return allWords().filter(inCat).filter(w=>!card(w.id));}
function newAllowance(){if(S.newToday.d!==today()){S.newToday={d:today(),n:0};}return Math.max(0,NEW_PER_DAY-S.newToday.n);}
function grade(id,g,isNew){ // g: 0 quên,1 khó,2 nhớ,3 dễ
  let c=card(id);
  if(!c){c={box:0,due:0,seen:0,ok:0};S.cards[id]=c;if(isNew){newAllowance();S.newToday.n++;}}
  c.seen++;
  if(g===0){c.box=0;c.due=Date.now()+60*1000;}
  else{c.ok++;c.box=Math.min(6,c.box+(g===3?2:g===2?1:0));if(g===1&&c.box===0)c.box=1;c.due=Date.now()+Math.max(INTERVALS[c.box],g===1?0.5:1)*864e5;}
  logReview(g>0);save();
}
function intervalLabel(c,g){ if(g===0)return '1 phút'; const b=Math.min(6,(c?c.box:0)+(g===3?2:g===2?1:0)); const d=Math.max(INTERVALS[g===1&&!c?1:b],g===1?0.5:1); return d<1?'12 giờ':d+' ngày';}
function learnedCount(){return allWords().filter(w=>{const c=card(w.id);return c&&c.box>=3;}).length;}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function speak(text,rate=0.9,pitch=1,done){
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=pitch;
    if(done){u.onend=done;u.onerror=done;}
    const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
    if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast('Trình duyệt chưa hỗ trợ phát âm');}
}
let toastT;function toast(m){let t=$('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2000);}

let CS=null;
function Cards(){
  if(!CS){
    const due=shuffle(dueCards()).map(w=>({w,isNew:false}));
    const nw=newCards().slice(0,newAllowance()).map(w=>({w,isNew:true}));
    CS={q:due.concat(nw),i:0,flip:false,total:due.length+nw.length};
  }
  drawCard();
}
function drawCard(){
  const v=$('#view');
  if(CS.i>=CS.q.length){
    const had=CS.total;CS=null;
    v.innerHTML=`<div class="card stack" style="text-align:center;padding:32px 18px"><div style="font-size:44px">🎯</div><h2>${had?'Xong lượt ôn tập':'Chưa có thẻ nào đến hạn'}</h2><p class="sub">${had?'Các thẻ đã được xếp lịch ôn lại. Quay lại vào ngày mai để giữ chuỗi.':'Bạn đã ôn hết thẻ đến hạn và dùng hết số từ mới hôm nay.'}</p><button class="btn primary block" id="a">Làm trắc nghiệm</button><button class="btn block" id="b">Về trang chủ</button></div>`;
    $('#a').onclick=()=>go('quiz');$('#b').onclick=()=>go('home');chips();return;
  }
  const {w,isNew}=CS.q[CS.i];const c=card(w.id);
  const ex=S.extra[w.id]||{};
  const front=`<span class="tag">${isNew?'Mới':'Ôn lại'} · ${esc(w.pos)}</span>${pic(w,96)}<div class="${wcls(w.w)}">${esc(w.w)}</div><div class="ipa">${esc(ipaOf(w))}</div><button class="speak" data-sp="1">🔊 Nghe</button><div class="hint">Chạm vào thẻ để xem nghĩa</div>`;
  const back=`<span class="tag">${esc(w.pos)}</span>${pic(w,64)}<div class="vi">${esc(w.vi)}</div><div class="ipa">${esc(w.w)} ${esc(ipaOf(w))}</div><p class="ex">“${esc(w.ex)}”</p><p class="exvi">${esc(w.exvi)}</p>${ex.def?`<p class="deflab">${esc(ex.def)}</p>`:''}<div class="row" style="justify-content:center"><button class="speak" data-sp="2">🔊 Nghe ${w.pos==='câu'?'câu trả lời':'câu ví dụ'}</button>${w.pos==='câu'?'':`<button class="speak" data-lk="1">🌐 Tra từ điển</button>`}${ex.audio?`<button class="speak" data-au="1">▶ Giọng thật</button>`:''}</div>`;
  v.innerHTML=`<div class="progress"><span>${CS.i+1}/${CS.q.length}</span><div class="bar"><i style="width:${Math.round(100*CS.i/CS.q.length)}%"></i></div></div>
  <div class="flip"><div class="face" id="face" role="button" tabindex="0" aria-label="Thẻ từ, chạm để lật">${CS.flip?back:front}</div></div>
  ${CS.flip?`<div class="rate">${[0,1,2,3].map(g=>`<button class="r${g}" data-g="${g}">${['Quên','Khó','Nhớ','Dễ'][g]}<small>${intervalLabel(c,g)}</small></button>`).join('')}</div>`:`<button class="btn primary block" id="show">Hiện nghĩa</button>`}`;
  const face=$('#face');
  const flip=()=>{CS.flip=!CS.flip;drawCard();};
  face.onclick=async e=>{const sp=e.target.closest('[data-sp]');if(sp){e.stopPropagation();speak(sp.dataset.sp==='1'?w.w:w.ex);return;}
    if(e.target.closest('[data-lk]')){e.stopPropagation();if(await lookup(w))drawCard();return;}
    if(e.target.closest('[data-au]')){e.stopPropagation();try{new Audio(ex.audio).play();}catch(err){toast('Không phát được âm thanh');}return;}
    flip();};
  face.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}};
  if(!CS.flip){$('#show').onclick=flip;speak(w.w);}
  else document.querySelectorAll('.rate button').forEach(b=>b.onclick=()=>{
    const g=+b.dataset.g;grade(w.id,g,isNew);
    if(g===0){CS.q.push({w,isNew:false});}
    CS.i++;CS.flip=false;drawCard();chips();
  });
}

/* ---------- Trắc nghiệm ---------- */
let QZ={mode:'en',s:null};
function Quiz(){
  const v=$('#view');
  if(!QZ.s){
    v.innerHTML=`<h2>Trắc nghiệm</h2><p class="sub">10 câu, 4 đáp án. Trả lời đúng cũng giúp lịch ôn của từ đó giãn ra.</p>
    <div class="seg" role="group" aria-label="Chế độ"><button data-m="en" aria-pressed="${QZ.mode==='en'}">Anh → Việt</button><button data-m="vi" aria-pressed="${QZ.mode==='vi'}">Việt → Anh</button></div>
    <button class="btn primary block" id="st">Bắt đầu</button>`;
    v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{QZ.mode=b.dataset.m;Quiz();});
    $('#st').onclick=()=>{
      const pool=poolWords();
      const wk=shuffle(pool.filter(w=>{const c=card(w.id);return !c||c.box<4;}));
      const picks=(wk.length>=10?wk:shuffle(pool)).slice(0,10);
      QZ.s={q:picks,i:0,score:0,done:false,miss:[]};Quiz();
    };
    return;
  }
  const s=QZ.s;
  if(s.i>=s.q.length){
    v.innerHTML=`<div class="card stack" style="text-align:center;padding:28px 18px"><div class="big" style="font-size:52px">${s.score}/${s.q.length}</div><h2>${s.score>=9?'Xuất sắc':s.score>=7?'Khá tốt':'Cần ôn thêm'}</h2>
    ${s.miss.length?`<div style="text-align:left"><p class="hint" style="margin:0 0 6px">Các từ bạn chọn sai:</p><div class="list">${s.miss.map(w=>`<div class="li"><div class="t"><b>${esc(w.w)}</b><span>${esc(w.vi)}</span></div></div>`).join('')}</div></div>`:''}
    <button class="btn primary block" id="again">Làm lượt khác</button></div>`;
    $('#again').onclick=()=>{QZ.s=null;Quiz();};chips();return;
  }
  const w=s.q[s.i];
  const others=shuffle(allWords().filter(x=>x.id!==w.id&&x.pos===w.pos)).slice(0,3).concat(shuffle(allWords().filter(x=>x.id!==w.id))).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
  const opts=shuffle([w].concat(others));
  const en=QZ.mode==='en';
  v.innerHTML=`<div class="progress"><span>Câu ${s.i+1}/${s.q.length}</span><div class="bar"><i style="width:${Math.round(100*s.i/s.q.length)}%"></i></div><span>Đúng ${s.score}</span></div>
  <div class="card"><div class="hint">${en?'Nghĩa của từ này là gì?':'Từ tiếng Anh nào có nghĩa này?'}</div>
  ${en?pic(w,56):''}<div class="q" style="${(en?w.w:w.vi).length>40?'font-size:22px':''}">${esc(en?w.w:w.vi)}</div>${en?`<div class="ipa">${esc(ipaOf(w))} <button class="speak" id="sp" style="margin-left:6px">🔊</button></div>`:''}
  <div class="opts" id="opts">${opts.map(o=>`<button class="opt" data-id="${o.id}">${esc(en?o.vi:o.w)}</button>`).join('')}</div></div>
  <div id="nx" style="margin-top:12px"></div>`;
  if(en){$('#sp').onclick=()=>speak(w.w);}
  $('#opts').onclick=e=>{
    const b=e.target.closest('.opt');if(!b||b.disabled)return;
    const ok=b.dataset.id===w.id;
    document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.id===w.id)x.classList.add('right');});
    if(!ok){b.classList.add('wrong');s.miss.push(w);}else s.score++;
    if(ok||card(w.id)){grade(w.id,ok?2:0,false);} else if(!ok){grade(w.id,0,false);} else {grade(w.id,2,false);}
    if(!en||true)speak(w.w);
    $('#nx').innerHTML=`<p class="ex" style="margin-bottom:10px">“${esc(w.ex)}”<br><span class="exvi">${esc(w.exvi)}</span></p><button class="btn primary block" id="next">${s.i+1<s.q.length?'Câu tiếp':'Xem kết quả'}</button>`;
    $('#next').onclick=()=>{s.i++;Quiz();};$('#next').focus();chips();
  };
}

/* ---------- Luyện nghe ---------- */
let LS={w:null,done:false};
function Listen(){
  const v=$('#view');
  if(!LS.w){const pool=poolWords();LS.w=pool[Math.floor(Math.random()*pool.length)];LS.done=false;}
  const w=LS.w;
  v.innerHTML=`<h2>Luyện nghe</h2><p class="sub">Nghe rồi gõ lại từ bạn nghe được.</p>
  <div class="card stack" style="align-items:stretch">
    <div class="row" style="justify-content:center"><button class="btn primary" id="p1">🔊 Nghe</button><button class="btn" id="p2">🐢 Nghe chậm</button></div>
    <input class="field" id="ans" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Gõ từ bạn nghe được" aria-label="Từ bạn nghe được">
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="row"><button class="btn primary" id="chk" style="flex:1">Kiểm tra</button><button class="btn" id="hint">Gợi ý</button><button class="btn" id="skip">Bỏ qua</button></div>
    <div id="rev"></div>
  </div>`;
  $('#p1').onclick=()=>speak(w.w,.9);$('#p2').onclick=()=>speak(w.w,.45);
  const inp=$('#ans');inp.focus();
  const next=()=>{LS.w=null;Listen();};
  const check=()=>{
    if(LS.done){next();return;}
    const a=norm(inp.value);if(!a)return;
    const ok=a===norm(w.w);
    grade(w.id,ok?2:0,false);LS.done=true;
    inp.classList.add(ok?'right':'wrong');
    $('#msg').className='msg '+(ok?'good':'bad');$('#msg').textContent=ok?'Chính xác':'Chưa đúng. Đáp án: '+w.w;
    $('#rev').innerHTML=`<div class="big">${esc(w.w)} <span class="ipa" style="font-weight:400">${esc(w.ipa)}</span></div><div>${esc(w.vi)}</div><p class="ex" style="margin-top:6px">“${esc(w.ex)}”</p>`;
    $('#chk').textContent='Từ tiếp theo';chips();
  };
  $('#chk').onclick=check;
  inp.onkeydown=e=>{if(e.key==='Enter')check();};
  $('#hint').onclick=()=>{$('#msg').className='msg';$('#msg').textContent=w.w[0]+' '+'_ '.repeat(w.w.length-1).trim()+'  ('+w.w.length+' chữ cái)';};
  $('#skip').onclick=next;
  setTimeout(()=>speak(w.w),250);
}

/* ---------- Hình minh họa (Twemoji, CC-BY 4.0) ---------- */
function emojiUrl(e){const cps=[...e].map(c=>c.codePointAt(0).toString(16));const f=cps.includes('200d')?cps:cps.filter(c=>c!=='fe0f');return 'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/'+f.join('-')+'.svg';}
function graphemes(s){try{return [...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s)].map(x=>x.segment);}catch(e){return [...s];}}
function pic(w,size){
  size=size||84;const g=w.img;if(!g)return '';
  if(/^https?:\/\//.test(g))return `<div class="pic"><img src="${esc(g)}" alt="" width="${size*1.6}" height="${size}" style="object-fit:cover;border-radius:14px" data-hide="1"></div>`;
  return `<div class="pic">${graphemes(g).slice(0,2).map(e=>`<img src="${emojiUrl(e)}" alt="" width="${size}" height="${size}" data-emo="${esc(e)}" data-size="${size}">`).join('')}</div>`;
}
document.addEventListener('error',e=>{
  const t=e.target;if(!t||t.tagName!=='IMG')return;
  if(t.dataset.emo){const s=document.createElement('span');s.className='emo';s.style.fontSize=(+t.dataset.size*0.85)+'px';s.textContent=t.dataset.emo;t.replaceWith(s);}
  else if(t.dataset.hide){t.style.display='none';}
},true);
const ipaOf=w=>w.ipa||((S.extra[w.id]||{}).ipa)||'';
const wcls=s=>s.length>26?'word xs':s.length>14?'word sm':'word';

/* ---------- Tra từ điển mở (Free Dictionary API, cần mạng) ---------- */
async function lookup(w){
  try{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w.w.toLowerCase()));
    if(!r.ok)throw 0;
    const e=(await r.json())[0];
    const ph=(e.phonetics||[]).find(p=>p.audio)||{};
    const ipa=e.phonetic||((e.phonetics||[]).find(p=>p.text)||{}).text||'';
    const d=(((e.meanings||[])[0]||{}).definitions||[])[0]||{};
    S.extra[w.id]={ipa,def:d.definition||'',audio:ph.audio?(ph.audio.startsWith('//')?'https:'+ph.audio:ph.audio):''};
    save();toast('Đã lưu phiên âm và định nghĩa');return true;
  }catch(err){toast('Không tra được. Kiểm tra kết nối mạng.');return false;}
}

/* ---------- Nhận giọng nói ---------- */
function recog(onres,onerr){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){onerr('unsupported');return null;}
  try{const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;
    r.onresult=e=>onres(e.results[0][0].transcript);r.onerror=e=>onerr(e.error||'error');r.start();return r;}
  catch(e){onerr('error');return null;}
}
function cmp(target,said){
  const t=norm(target).split(/\s+/).filter(Boolean);const s=new Set(norm(said).split(/\s+/));
  const hit=t.map(x=>s.has(x));
  return{t,hit,pct:Math.round(100*hit.filter(Boolean).length/Math.max(1,t.length))};
}
function diffHtml(r){return r.t.map((x,i)=>`<span class="wd ${r.hit[i]?'good':'bad'}">${esc(x)}</span>`).join(' ');}
const micMsg=e=>e==='unsupported'?'Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy đọc to rồi tự chấm.':e==='not-allowed'||e==='service-not-allowed'?'Chưa được cấp quyền micro. Hãy cho phép micro cho trang này.':e==='no-speech'?'Không nghe thấy giọng nói. Thử lại nhé.':'Không nhận được giọng nói. Nhận giọng nói cần kết nối mạng.';

/* ---------- Luyện đề TOEIC ---------- */
let PR=null;
function mk(stem,opts,ans,exp){return{stem,opts:shuffle(opts.map((t,i)=>({t,ok:i===ans}))),exp};}
function startPractice(set,pi){
  let qs;
  if(set==='p5')qs=shuffle(P5).slice(0,10).map(q=>mk(q[0],q[1],q[2],q[3]));
  else if(set==='p2')qs=shuffle(P2).map(q=>Object.assign(mk('',q[1],q[2],q[3]),{listen:q[0]}));
  else{const p=P7[pi];qs=p.qs.map(q=>Object.assign(mk(q[0],q[1],q[2],q[3]),{pre:p.text,ptitle:p.title}));}
  PR={set,pi,qs,i:0,score:0,wrong:[]};
}
function Practice(){
  const v=$('#view');
  if(!PR){
    const b=k=>S.scores[k]!=null?`Điểm cao nhất: ${S.scores[k]}%`:'Chưa làm';
    v.innerHTML=`<h2>Luyện đề TOEIC</h2><p class="sub">Đề tự biên soạn theo dạng bài của TOEIC. Mỗi câu có giải thích bằng tiếng Việt.</p>
    <div class="stack">
      <div class="card stack"><div><h3 style="font-size:18px">Part 5: Điền từ vào câu</h3><p class="hint" style="margin:4px 0 0">10 câu ngẫu nhiên từ ngân hàng ${P5.length} câu về ngữ pháp và từ vựng. ${b('p5')}</p></div><button class="btn primary" data-s="p5">Bắt đầu</button></div>
      <div class="card stack"><div><h3 style="font-size:18px">Part 2: Hỏi và đáp (nghe)</h3><p class="hint" style="margin:4px 0 0">Nghe câu hỏi và ba đáp án, chọn câu trả lời phù hợp. Nội dung đáp án chỉ hiện sau khi bạn chọn. ${b('p2')}</p></div><button class="btn primary" data-s="p2">Bắt đầu</button></div>
      <div class="card stack"><div><h3 style="font-size:18px">Part 7: Đọc hiểu</h3><p class="hint" style="margin:4px 0 0">Đoạn ngắn kèm ba câu hỏi. ${b('p7')}</p></div><div class="row">${P7.map((p,i)=>`<button class="btn" data-s="p7" data-p="${i}" style="flex:1">${esc(p.title.split(':')[0])}</button>`).join('')}</div></div>
    </div>`;
    v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{startPractice(b.dataset.s,+b.dataset.p||0);Practice();});
    return;
  }
  if(PR.i>=PR.qs.length){
    const pct=Math.round(100*PR.score/PR.qs.length);
    if(S.scores[PR.set]==null||pct>S.scores[PR.set]){S.scores[PR.set]=pct;save();}
    v.innerHTML=`<div class="card stack" style="text-align:center;padding:26px 18px"><div class="big" style="font-size:52px">${PR.score}/${PR.qs.length}</div><h2>${pct>=80?'Rất tốt':pct>=60?'Khá':'Cần luyện thêm'}</h2></div>
    ${PR.wrong.length?`<h3 style="margin:18px 0 8px;font-size:18px">Xem lại câu sai</h3><div class="stack">${PR.wrong.map(q=>`<div class="card">${q.stem?`<div style="font-weight:600;margin-bottom:6px">${esc(q.stem)}</div>`:`<div style="font-weight:600;margin-bottom:6px">${esc(q.listen)}</div>`}<div class="msg good">Đáp án: ${esc(q.opts.find(o=>o.ok).t)}</div><p class="exvi" style="margin:4px 0 0">${esc(q.exp)}</p></div>`).join('')}</div>`:''}
    <div class="row" style="margin-top:14px"><button class="btn primary" id="again" style="flex:1">Làm lại</button><button class="btn" id="menu" style="flex:1">Chọn phần khác</button></div>`;
    $('#again').onclick=()=>{startPractice(PR.set,PR.pi);Practice();};
    $('#menu').onclick=()=>{PR=null;Practice();};
    chips();return;
  }
  const q=PR.qs[PR.i],L='ABCD';
  v.innerHTML=`<div class="progress"><span>${PR.i+1}/${PR.qs.length}</span><div class="bar"><i style="width:${Math.round(100*PR.i/PR.qs.length)}%"></i></div><span>Đúng ${PR.score}</span></div>
  <div class="card">
    ${q.pre?`<div class="hint" style="font-weight:600">${esc(q.ptitle)}</div><p style="white-space:pre-line;margin:6px 0 12px">${esc(q.pre)}</p><hr style="border:0;border-top:1px solid var(--line);margin:0 0 10px">`:''}
    ${q.listen?`<div class="row" style="margin-bottom:8px"><button class="btn primary" id="pq">🔊 Nghe câu hỏi</button></div><div class="hint">Chạm 🔊 ở từng đáp án để nghe, rồi chọn.</div>`:''}
    ${q.stem?`<div class="big" style="font-size:20px;margin:6px 0 10px;line-height:1.35">${esc(q.stem)}</div>`:''}
    <div class="opts" id="opts">${q.opts.map((o,i)=>q.listen?`<div class="row" style="flex-wrap:nowrap"><button class="speak" data-pl="${i}" aria-label="Nghe đáp án ${L[i]}">🔊 ${L[i]}</button><button class="opt" style="flex:1" data-i="${i}">Chọn ${L[i]}</button></div>`:`<button class="opt" data-i="${i}">${L[i]}. ${esc(o.t)}</button>`).join('')}</div>
  </div><div id="nx" style="margin-top:12px"></div>`;
  if(q.listen){$('#pq').onclick=()=>speak(q.listen,.9);setTimeout(()=>speak(q.listen,.9),200);}
  $('#opts').onclick=e=>{
    const pl=e.target.closest('[data-pl]');if(pl){speak(q.opts[+pl.dataset.pl].t,.9);return;}
    const b=e.target.closest('.opt');if(!b||b.disabled)return;
    const ok=q.opts[+b.dataset.i].ok;
    document.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(q.opts[i].ok)x.classList.add('right');if(q.listen)x.textContent=L[i]+'. '+q.opts[i].t;});
    if(!ok){b.classList.add('wrong');PR.wrong.push(q);}else PR.score++;
    logReview(ok);save();
    $('#nx').innerHTML=`<p class="exvi" style="margin:0 0 10px;font-size:15px;color:var(--ink)">${ok?'Chính xác. ':'Chưa đúng. '}${esc(q.exp)}</p><button class="btn primary block" id="next">${PR.i+1<PR.qs.length?'Câu tiếp':'Xem kết quả'}</button>`;
    $('#next').onclick=()=>{PR.i++;Practice();};$('#next').focus();chips();
  };
}

/* ---------- Hội thoại (phần Giao tiếp) ---------- */
let DL={i:null,mode:'view',role:null,step:0,tok:0};
function playDialog(d,i,tok){
  if(tok!==DL.tok||i>=d.lines.length)return;
  const L=d.lines[i];
  const el=document.querySelector('[data-ln="'+i+'"]');if(el)el.classList.add('playing');
  speak(L[1],.9,L[0]==='A'?1:.8,()=>{const e2=document.querySelector('[data-ln="'+i+'"]');if(e2)e2.classList.remove('playing');setTimeout(()=>playDialog(d,i+1,tok),250);});
}
function bubble(L,d,hideEn,extra){
  const mine=L[0]==='A';
  return `<div class="bub ${mine?'a':'b'}" ${extra||''}><small>${esc(d.roles[mine?0:1])}</small><div>${hideEn?'':esc(L[1])}</div><span>${esc(L[2])}</span></div>`;
}
function Dialog(){
  const v=$('#view');
  if(DL.i===null){
    v.innerHTML=`<h2>Hội thoại</h2><p class="sub">Nghe, đọc theo và đóng vai trong các tình huống thường gặp.</p><div class="list">${DIALOGS.map((d,i)=>`<button class="li" data-d="${i}" style="text-align:left;width:100%"><span style="font-size:28px">${d.img}</span><div class="t"><b>${esc(d.t)}</b><span>${d.lines.length} câu · ${esc(d.roles[0])} và ${esc(d.roles[1])}</span></div></button>`).join('')}</div>`;
    v.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{DL={i:+b.dataset.d,mode:'view',role:null,step:0,tok:DL.tok+1};Dialog();});
    return;
  }
  const d=DIALOGS[DL.i];
  if(DL.mode==='view'){
    v.innerHTML=`<button class="btn" id="back" style="min-height:38px;padding:6px 12px;margin-bottom:10px">← Danh sách</button>
    <h2>${d.img} ${esc(d.t)}</h2>
    <div class="chat">${d.lines.map((L,i)=>bubble(L,d,false,`data-ln="${i}"`)).join('')}</div>
    <div class="stack" style="margin-top:14px">
      <button class="btn primary block" id="pa">▶ Nghe cả hội thoại</button>
      <div class="row"><button class="btn" id="r0" style="flex:1">Đóng vai: ${esc(d.roles[0])}</button><button class="btn" id="r1" style="flex:1">Đóng vai: ${esc(d.roles[1])}</button></div>
    </div>`;
    $('#back').onclick=()=>{DL.tok++;try{speechSynthesis.cancel();}catch(e){}DL.i=null;Dialog();};
    $('#pa').onclick=()=>{DL.tok++;playDialog(d,0,DL.tok);};
    $('#r0').onclick=()=>{DL.tok++;try{speechSynthesis.cancel();}catch(e){}DL.mode='play';DL.role='A';DL.step=0;Dialog();};
    $('#r1').onclick=()=>{DL.tok++;try{speechSynthesis.cancel();}catch(e){}DL.mode='play';DL.role='B';DL.step=0;Dialog();};
    return;
  }
  // đóng vai
  const done=DL.step>=d.lines.length;
  const past=d.lines.slice(0,DL.step);
  let cur='';
  if(done){
    cur=`<div class="card stack" style="text-align:center"><div style="font-size:40px">🎉</div><h3>Bạn đã hoàn thành hội thoại</h3><button class="btn primary" id="rep">Đóng vai lại</button><button class="btn" id="back2">Danh sách hội thoại</button></div>`;
  }else{
    const L=d.lines[DL.step];const mine=L[0]===DL.role;
    if(!mine){
      cur=`<div class="chat">${bubble(L,d,false)}</div><button class="btn primary block" id="nx" style="margin-top:10px">Tiếp tục</button>`;
    }else{
      cur=`<div class="card stack"><div class="hint">Đến lượt bạn (${esc(d.roles[DL.role==='A'?0:1])}). Hãy nói câu có nghĩa:</div><div class="big" style="font-size:20px">${esc(L[2])}</div>
      <div class="row"><button class="btn primary" id="mic">🎤 Nói</button><button class="btn" id="hear">🔊 Nghe mẫu</button><button class="btn" id="show">Xem câu mẫu</button></div>
      <div id="res" aria-live="polite"></div><button class="btn primary block" id="nx" style="display:none">Tiếp tục</button></div>`;
    }
  }
  v.innerHTML=`<button class="btn" id="back" style="min-height:38px;padding:6px 12px;margin-bottom:10px">← Thoát</button><h3 style="margin-bottom:8px">${d.img} ${esc(d.t)}</h3>
  <div class="chat">${past.map(L=>bubble(L,d,false)).join('')}</div><div style="margin-top:10px">${cur}</div>`;
  $('#back').onclick=()=>{DL.mode='view';Dialog();};
  if(done){$('#rep').onclick=()=>{DL.step=0;Dialog();};$('#back2').onclick=()=>{DL.i=null;DL.mode='view';Dialog();};return;}
  const L=d.lines[DL.step];const mine=L[0]===DL.role;
  const next=()=>{DL.step++;Dialog();window.scrollTo(0,0);$('#view').scrollTop=1e6;};
  if(!mine){setTimeout(()=>speak(L[1],.9,L[0]==='A'?1:.8),150);$('#nx').onclick=next;}
  else{
    $('#hear').onclick=()=>speak(L[1],.9);
    $('#show').onclick=()=>{$('#res').innerHTML=`<p class="ex">“${esc(L[1])}”</p>`;$('#nx').style.display='';};
    $('#nx').onclick=next;
    $('#mic').onclick=()=>{
      $('#res').innerHTML='<p class="hint">Đang nghe... hãy nói câu tiếng Anh.</p>';
      recog(txt=>{const r=cmp(L[1],txt);$('#res').innerHTML=`<p class="hint" style="margin:0">Bạn nói: “${esc(txt)}”</p><p style="margin:6px 0">${diffHtml(r)}</p><div class="msg ${r.pct>=80?'good':'bad'}">${r.pct}% từ đúng</div><p class="ex">“${esc(L[1])}”</p>`;$('#nx').style.display='';},
        err=>{$('#res').innerHTML=`<p class="msg bad">${esc(micMsg(err))}</p><p class="ex">“${esc(L[1])}”</p>`;$('#nx').style.display='';});
    };
  }
}

/* ---------- Luyện nói (phần Giao tiếp) ---------- */
let SP={w:null,res:null};
function Speak(){
  const v=$('#view');
  if(!SP.w){const p=poolWords();SP.w=p[Math.floor(Math.random()*p.length)];SP.res=null;}
  const w=SP.w;
  v.innerHTML=`<h2>Luyện nói</h2><p class="sub">Nghe câu mẫu, bấm micro và nói lại. App so khớp từng từ bạn nói.</p>
  <div class="card stack" style="align-items:stretch;text-align:center">
    ${pic(w,84)}
    <div class="${wcls(w.w)}" style="font-size:26px">${esc(w.w)}</div>
    <div class="vi" style="font-size:18px;color:var(--muted)">${esc(w.vi)}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="p1">🔊 Nghe</button><button class="btn" id="p2">🐢 Chậm</button><button class="btn primary" id="mic">🎤 Nói</button></div>
    <div id="res" aria-live="polite" style="min-height:70px"></div>
    <button class="btn block" id="nxt">Câu khác</button>
  </div>`;
  $('#p1').onclick=()=>speak(w.w,.9);$('#p2').onclick=()=>speak(w.w,.5);
  $('#nxt').onclick=()=>{SP.w=null;Speak();};
  $('#mic').onclick=()=>{
    $('#res').innerHTML='<p class="hint">Đang nghe... hãy nói câu trên.</p>';
    recog(txt=>{const r=cmp(w.w,txt);grade(w.id,r.pct>=80?2:1,false);chips();
      $('#res').innerHTML=`<p class="hint" style="margin:0">Bạn nói: “${esc(txt)}”</p><p style="margin:6px 0">${diffHtml(r)}</p><div class="msg ${r.pct>=80?'good':'bad'}">${r.pct}% từ đúng${r.pct>=80?'. Rất tốt!':'. Nghe lại rồi thử lần nữa.'}</div>`;},
      err=>{$('#res').innerHTML=`<p class="msg bad">${esc(micMsg(err))}</p><div class="row" style="justify-content:center"><button class="btn" id="ok1">Tôi nói tốt</button><button class="btn" id="ok0">Cần luyện thêm</button></div>`;
        const f=g=>()=>{grade(w.id,g,false);chips();SP.w=null;Speak();};
        const a=$('#ok1'),b=$('#ok0');if(a)a.onclick=f(2);if(b)b.onclick=f(1);});
  };
}

/* ---------- Nhập CSV ---------- */
function importText(raw){
  raw=String(raw).replace(/^\uFEFF/,'').trim();
  if(!raw)return{added:0,msg:'Chưa có nội dung để nhập.'};
  if(raw[0]==='{')return{added:0,msg:'Đây là bản sao lưu. Hãy bấm Khôi phục sao lưu.'};
  const lines=raw.split(/\r?\n/).filter(l=>l.trim());
  const first=lines[0];
  const delim=['\t','|',';',','].find(d=>first.includes(d))||',';
  const split=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===delim&&!q){out.push(cur.trim());cur='';}else cur+=ch;}out.push(cur.trim());return out;};
  let rows=lines.map(split);
  if(/^(word|từ|tu|english)$/i.test(rows[0][0]))rows=rows.slice(1);
  const have=new Set(allWords().map(w=>w.w.toLowerCase()));
  let added=0,skip=0,bad=0;
  rows.forEach((r,i)=>{
    if(!r[0]||!r[1]){bad++;return;}
    if(have.has(r[0].toLowerCase())){skip++;return;}
    have.add(r[0].toLowerCase());
    S.custom.push({id:'c'+Date.now()+'_'+i,w:r[0],vi:r[1],ex:r[2]||r[0],exvi:r[3]||'',ipa:r[4]||'',pos:r[5]||(S.deck==='talk'?'câu':'từ'),cat:r[6]||'Của bạn',img:r[7]||'',deck:S.deck,custom:true});
    added++;
  });
  return{added,msg:`Đã nhập ${added} từ. Bỏ qua ${skip} từ trùng và ${bad} dòng thiếu nghĩa.`};
}
